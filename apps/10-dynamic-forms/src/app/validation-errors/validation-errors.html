@if (visible()) {
  <ul
    class="space-y-1 text-sm"
    role="alert"
    aria-live="polite"
    [class.list-disc]="hasMultipleErrors()"
    [class.pl-5]="hasMultipleErrors()"
  >
    @for (error of errors(); track error.kind) {
      <li>
        <span nbText size="xs" class="text-red-600!">{{ error.message }}</span>
      </li>
    }
  </ul>
}
