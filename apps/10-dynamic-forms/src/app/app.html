<!-- HERO -->
<header class="flex flex-col gap-3" aria-label="Lesson header">
  <div
    nbCallout
    tone="lavender"
    size="md"
    class="w-fit"
    aria-label="Lesson 10: Dynamic Forms"
  >
    <span aria-hidden="true">10</span>
    <hr nbSeparator orientation="vertical" aria-hidden="true" />
    <span class="text-sm" i18n="@@lessonDynamicFormsLabel">
      Dynamic Forms
    </span>
  </div>

  <div nbChipGroup nbCluster gap="md" aria-label="Lesson topics">
    <span nbChip tone="danger" i18n="@@angular22Label"> Angular 22 </span>
    <span nbChip tone="accent" i18n="@@signalFormsLabel"> Signal Forms </span>
    <span nbChip tone="black" i18n="@@basicLabel"> Ng-Brutalism </span>
  </div>
</header>

<!-- ROLE TABS -->
<div
  role="group"
  class="grid grid-cols-2 gap-2.5"
  aria-label="Choose a role"
  i18n-aria-label="@@chooseRoleLabel"
>
  @for (role of roleTabs(); track role.id) {
    <button
      nbButton
      fullWidth
      type="button"
      size="md"
      class="h-auto! min-h-19 flex-col! gap-1!"
      [tone]="role.tone"
      [attr.aria-pressed]="role.selected"
      (click)="selectRole(role.id)"
    >
      <span class="text-xl leading-none" aria-hidden="true">{{
        role.emoji
      }}</span>
      <span
        nbText
        size="xs"
        weight="black"
        transform="uppercase"
        tracking="wide"
      >
        {{ role.label }}
      </span>
    </button>
  }
</div>

<!-- FORM -->
@switch (selectedRole()) {
  @case ('frontend') {
    <app-frontend-form />
  }
  @case ('designer') {
    <app-designer-form />
  }
}

<!-- LESSON NAVIGATION -->
<nav
  nbCluster
  gap="md"
  align="center"
  justify="between"
  class="mt-6 mb-4"
  aria-label="Lesson navigation"
>
  <a
    nbButton
    tone="warning"
    size="md"
    radius="md"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Go to the previous lesson"
    href="https://github.com/KShewengger/angular-signal-forms-cookbook/tree/main/apps/09-form-submission"
  >
    <span nbButtonTrailingIcon shape="circle" class="grid place-items-center">
      <ng-icon aria-hidden="true" size="20" name="tablerCircleArrowLeftFill" />
    </span>

    <span
      nbText
      size="md"
      weight="black"
      transform="uppercase"
      tracking="wide"
      i18n="@@prevFormSubmission"
    >
      Prev: Form Submission
    </span>
  </a>

  <a
    nbButton
    tone="success"
    size="md"
    radius="md"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Go to the next lesson"
    href="https://github.com/KShewengger/angular-signal-forms-cookbook/tree/main/apps"
  >
    <span
      nbText
      size="md"
      weight="black"
      transform="uppercase"
      tracking="wide"
      i18n="@@nextZodSchema"
    >
      Next: Zod Schema Validation
    </span>

    <span nbButtonTrailingIcon shape="circle" class="grid place-items-center">
      <ng-icon aria-hidden="true" size="20" name="tablerCircleArrowRightFill" />
    </span>
  </a>
</nav>

<!-- FOOTER -->
<footer nbCluster gap="sm" align="center" justify="center" class="w-full pt-4">
  <ng-icon
    aria-hidden="true"
    class="text-gray-300"
    size="16"
    name="tablerCopyright"
  />

  <small nbText tone="muted" size="xs" i18n="@@authorLabel">
    Kristy Mae Almuete
  </small>

  <hr nbSeparator orientation="vertical" aria-hidden="true" />

  <a
    nbText
    href="https://github.com/KShewengger/angular-signal-forms-cookbook/tree/main/apps/10-dynamic-forms"
    tone="danger"
    size="xs"
    target="_blank"
    rel="noopener noreferrer"
    i18n="@@githubRepository"
    >GitHub Repo</a
  >
</footer>
