<main nbStack gap="md" class="relative grow p-8 pb-0 pt-20">
  <!-- CONFIRM EMAIL CARD -->
  <article aria-labelledby="registration-title">
    <nb-card class="relative border-t-0 pt-0!">
      <!-- HEADER -->
      <nb-card-header nbStack gap="md" class="px-0!">
        <div
          nbMediaFrame
          ratio="21/9"
          tone="background"
          shadow="hard"
          class="relative -top-0.5 mb-2 overflow-hidden"
        >
          <img
            priority
            ngSrc="hero-cover.png"
            width="2048"
            height="1251"
            class="h-full w-full object-cover"
            alt="Illustration of a an office managing an Angular books"
          />
        </div>

        <div nbStack gap="md" class="px-6">
          <div
            nbCallout
            tone="lavender"
            size="md"
            class="w-fit"
            aria-label="Lesson 3: Cross-Field Validation"
          >
            <span aria-hidden="true">03</span>
            <hr nbSeparator orientation="vertical" aria-hidden="true" />
            <span class="text-sm" i18n="@@lessonCrossFieldLabel"
              >Cross-Field Validation</span
            >
          </div>

          <div nbCluster gap="sm" align="start" justify="between" wrap="nowrap">
            <nb-card-title>
              <h1
                i18n="@@confirmEmailTitle"
                id="registration-title"
                nbDisplay
                size="lg"
                underline="bar"
                class="font-mono font-black uppercase leading-tight"
              >
                Confirm Email
              </h1>
            </nb-card-title>

            <div
              nbChipGroup
              nbStack
              gap="md"
              align="end"
              class="min-w-28"
              aria-label="Lesson topics"
            >
              <span nbChip tone="danger" i18n="@@angular22Label">
                Angular 22
              </span>

              <span nbChip tone="accent" i18n="@@signalFormsLabel">
                Signal Forms
              </span>

              <span nbChip tone="black" i18n="@@basicLabel">
                Ng-Brutalism
              </span>
            </div>
          </div>
        </div>
      </nb-card-header>

      <hr nbSeparator variant="dashed" aria-hidden="true" />

      <div nbStack gap="lg" class="px-6">
        <div nbSplit ratio="1:1" gap="xl" collapse="sm" align="start">
          <div
            nbMediaFrame
            ratio="3/4"
            tone="pink"
            border="strong"
            radius="lg"
            shadow="none"
          >
            <img src="passport.png" alt="Passport" />
          </div>

          <form novalidate nbStack gap="lg" class="mb-4 z-50">
            <div class="grid w-full w-96 gap-2">
              <label nbLabel for="email" i18n="@@emailLabel">Email</label>
              <nb-input-group>
                <span nbInputPrefix>@</span>
                <input
                  nbInput
                  id="email"
                  placeholder="user@example.com"
                  [formField]="userForm.email"
                />

                @if (valid()) {
                <span nbInputSuffix class="bg-white border-0! w-auto">
                  <ng-icon
                    name="tablerCheck"
                    class="text-green-500! relative right-2"
                    size="16"
                /></span>
                }
              </nb-input-group>

              <app-validation-errors [field]="userForm.email" />
            </div>

            <div class="grid w-full w-96 gap-2">
              <label nbLabel for="confirm-email" i18n="@@confirmEmailLabel"
                >Confirm Email</label
              >
              <nb-input-group>
                <span nbInputPrefix>@</span>
                <input
                  nbInput
                  id="confirm-email"
                  placeholder="user@example.com"
                  [formField]="userForm.confirmEmail"
                />

                @if (valid()) {
                <span nbInputSuffix class="bg-white border-0! w-auto">
                  <ng-icon
                    name="tablerCheck"
                    class="text-green-500! relative right-2"
                    size="16"
                /></span>
                }
              </nb-input-group>

              <app-validation-errors [field]="userForm.confirmEmail" />
            </div>

            <div
              nbHalftone
              shape="rectangle"
              [rows]="3"
              [columns]="7"
              class="absolute bottom-0 right-0 z-10"
            ></div>
          </form>
        </div>
      </div>

      <!-- DECORATIONS -->
      <nb-sticker
        shape="burst-wide"
        tone="yellow"
        class="absolute -right-12 -top-12 sm:-right-20 sm:-top-16"
        aria-hidden="true"
        i18n="@@testItLabel"
        [rotate]="5"
      >
        TEST<br />
        IT!
      </nb-sticker>
    </nb-card>
  </article>

  <!-- LESSON NAVIGATION -->
  <nav
    nbCluster
    gap="md"
    align="center"
    justify="between"
    class="mb-16"
    aria-label="Lesson navigation"
  >
    <a
      nbButton
      tone="warning"
      size="md"
      radius="md"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Go to the previous lesson"
      href="https://github.com/KShewengger/angular-signal-forms-cookbook/tree/main/apps/02-built-in-validations"
    >
      <span nbButtonTrailingIcon shape="circle" class="grid place-items-center">
        <ng-icon
          aria-hidden="true"
          size="20"
          name="tablerCircleArrowLeftFill"
        />
      </span>

      <span
        nbText
        size="md"
        weight="black"
        transform="uppercase"
        tracking="wide"
        i18n="@@prevValidations"
      >
        Prev: Validations
      </span>
    </a>

    <a
      nbButton
      tone="success"
      size="md"
      radius="md"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Go to the next lesson"
      href="https://github.com/KShewengger/angular-signal-forms-cookbook/tree/main/apps/04-async-validation"
    >
      <span
        nbText
        size="md"
        weight="black"
        transform="uppercase"
        tracking="wide"
        i18n="@@nextAsyncValidation"
      >
        Next: Async Validation
      </span>

      <span nbButtonTrailingIcon shape="circle" class="grid place-items-center">
        <ng-icon
          aria-hidden="true"
          size="20"
          name="tablerCircleArrowRightFill"
        />
      </span>
    </a>
  </nav>

  <!-- FOOTER -->
  <footer
    nbCluster
    gap="sm"
    align="center"
    justify="center"
    class="w-full pt-4"
  >
    <ng-icon
      aria-hidden="true"
      class="text-gray-300"
      size="16"
      name="tablerCopyright"
    />

    <small nbText tone="muted" size="xs" i18n="@@authorLabel">
      Kristy Mae Almuete
    </small>

    <hr nbSeparator orientation="vertical" aria-hidden="true" />

    <a
      href="https://github.com/KShewengger/angular-signal-forms-cookbook/tree/main/apps/03-cross-field-validation"
      nbText
      tone="danger"
      size="xs"
      i18n="@@githubRepository"
      target="_blank"
      rel="noopener noreferrer"
      >GitHub Repo</a
    >
  </footer>
</main>
