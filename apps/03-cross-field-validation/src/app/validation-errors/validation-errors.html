@if (visible()) {
<ul
  class="space-y-1 text-sm text-red-600"
  role="alert"
  [id]="messageId()"
  [class.list-disc]="hasMultipleErrors()"
  [class.pl-5]="hasMultipleErrors()"
>
  @for (error of errors(); track error.kind) {
  <li>
    <span nbText size="xs" tone="danger">{{ error.message }}</span>
  </li>
  }
</ul>
}
