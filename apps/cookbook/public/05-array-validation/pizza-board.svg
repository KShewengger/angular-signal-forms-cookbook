  <!-- Golden outer top rim -->
  <ellipse
    cx="137"
    cy="91"
    rx="94"
    ry="68"
    fill="#F2BE3C"
    stroke="#111111"
    stroke-width="6"/>

  <!-- Inner empty tray surface -->
  <ellipse
    cx="137"
    cy="88"
    rx="81"
    ry="56"
