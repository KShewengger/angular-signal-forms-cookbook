       C189 24 231 56 231 96
       L231 112
       C231 151 189 176 137 176
       C101 176 70 164 54 145
       L30 162
       C21 169 8 166 3 156
       L3 139
       C3 131 7 125 14 121
       L42 103
       Z"
    fill="#A96624"
