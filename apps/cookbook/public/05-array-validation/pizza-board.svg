    stroke-linejoin="round"/>

  <!-- Main tray side/rim -->
  <path
    d="M42 94
       C42 54 84 22 137 22
       C190 22 232 54 232 94
       L232 109
       C232 149 190 175 137 175
       C84 175 42 149 42 109
