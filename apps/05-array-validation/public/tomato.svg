<svg xmlns="http://www.w3.org/2000/svg"
     width="112"
     height="84"
     viewBox="0 0 112 84"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Neo-brutalist tomato slice</title>
  <desc id="desc">A single tomato slice with bold black outlines, a darker side wall, seed chambers, and a transparent background.</desc>

  <!-- Hard offset shadow -->
  <ellipse
    cx="59"
    cy="48"
    rx="42"
    ry="24"
    fill="#111111"/>

  <!-- Tomato side wall -->
  <path
    d="M15 37
       C15 22 33 11 56 11
       C79 11 97 22 97 37
       L97 47
       C97 62 79 73 56 73
       C33 73 15 62 15 47
       Z"
    fill="#B5312F"
    stroke="#111111"
    stroke-width="5"
    stroke-linejoin="round"/>

  <!-- Tomato top -->
  <ellipse
    cx="56"
    cy="37"
    rx="41"
    ry="25"
    fill="#F24B3D"
    stroke="#111111"
    stroke-width="5"/>

  <!-- Inner flesh -->
  <ellipse
    cx="56"
    cy="37"
    rx="31"
    ry="18"
    fill="#FF7664"
    stroke="#111111"
    stroke-width="3.5"/>

  <!-- Seed chambers -->
  <path
    d="M54 21
       C46 23 41 28 40 35
       C40 39 43 42 48 42
       C53 42 56 38 56 32
       C56 27 55 23 54 21Z"
    fill="#FFD18A"
    stroke="#111111"
    stroke-width="3"/>

  <path
    d="M61 22
       C69 24 74 29 74 36
       C74 41 71 44 66 44
       C61 44 58 40 58 34
       C58 29 59 25 61 22Z"
    fill="#FFD18A"
    stroke="#111111"
    stroke-width="3"/>

  <path
    d="M45 45
       C48 49 52 52 56 53
       C60 52 64 49 67 45
       C64 44 61 43 56 43
       C51 43 48 44 45 45Z"
    fill="#FFD18A"
    stroke="#111111"
    stroke-width="3"/>

  <!-- Seeds -->
  <ellipse cx="48" cy="32" rx="2.2" ry="1.5" fill="#FFF3C6"/>
  <ellipse cx="66" cy="33" rx="2.2" ry="1.5" fill="#FFF3C6"/>
  <ellipse cx="56" cy="48" rx="2.3" ry="1.5" fill="#FFF3C6"/>

  <!-- Highlight -->
  <path
    d="M28 31
       C35 22 45 18 56 18
       C67 18 77 22 84 30"
    fill="none"
    stroke="#FF9B87"
    stroke-width="5"
    stroke-linecap="round"/>
</svg>
