name: CI

# Runs on every PR into main, and on pushes to main itself.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run if you push again to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # nx affected needs history to compare the PR against its base.
          fetch-depth: 0

      # Version is read from the "packageManager" field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Computes the base & head SHAs so `nx affected` knows what changed.
      - name: Derive affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Check formatting
        run: pnpm exec nx format:check

      - name: Lint affected
        run: pnpm exec nx affected -t lint

      - name: Test affected
        run: pnpm exec nx affected -t test

      - name: Build affected
        run: pnpm exec nx affected -t build
